# Authentik — the identity provider for landeck.pro. Runs on the VPS, exposed
# only through a bundled Cloudflare Tunnel (no inbound ports on the box).
#
# Based on the official compose (goauthentik.io/docker-compose.yml, 2026.8.x —
# recent Authentik no longer needs a separate Redis). Changes from upstream:
#   * HTTP published to 127.0.0.1 only (the tunnel reaches it in-network)
#   * HTTPS port not published
#   * added a `cloudflared` service
#   * mounted ./blueprints as a custom blueprint dir
#
# Setup + tunnel creation: see README.md.

services:
  postgresql:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${PG_DB:-authentik}
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
    volumes:
      - database:/var/lib/postgresql/data

  server:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8.1}
    restart: unless-stopped
    command: server
    env_file:
      - .env
      # Email provider preset (AUTHENTIK_EMAIL__*). Optional: Authentik runs
      # fine with no email configured. Pick one:  cp mail/<provider>.env.example mail.env
      - path: mail.env
        required: false
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    ports:
      - "127.0.0.1:${COMPOSE_PORT_HTTP:-9000}:9000"
    shm_size: 512mb
    volumes:
      - ./data:/data
      - ./custom-templates:/templates
      - ./blueprints:/blueprints/custom:ro
    depends_on:
      postgresql:
        condition: service_healthy

  worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8.1}
    restart: unless-stopped
    command: worker
    user: root
    env_file:
      - .env
      - path: mail.env
        required: false
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    shm_size: 512mb
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
      - ./certs:/certs
      - ./custom-templates:/templates
      - ./blueprints:/blueprints/custom:ro
    depends_on:
      postgresql:
        condition: service_healthy

  # Bundled Cloudflare Tunnel. The public hostname mapping
  #   auth.landeck.pro  ->  http://server:9000
  # is configured in the Cloudflare Zero Trust dashboard for this tunnel; the
  # token below is all the daemon needs. See README.md.
  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN:?cloudflared tunnel token required}
    depends_on:
      server:
        condition: service_started

volumes:
  database:
    driver: local
