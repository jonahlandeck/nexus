# nexus bootstrap blueprint.
#
# Applied automatically by the Authentik `worker` container (mounted at
# /blueprints/custom/nexus.yaml). Creates everything nexus needs:
#   * groups: admins, beta-testers, nexus-service
#   * OAuth2/OIDC providers + applications: nexus, meat-and-potatoes
#   * a `groups` scope mapping so the groups claim reaches the token
#   * svc-nexus service account + scoped nexus-admin-api role + nexus-api token
#   * WebAuthn step-up on the `admins` group (bound into the auth flow)
#
# TARGETS Authentik 2026.8.x. Model fields (redirect_uris shape, RBAC
# permission slugs, flow stage orders) drift between releases — after a version
# bump, re-check against https://docs.goauthentik.io/customize/blueprints/v1/models/
# and re-run the adversarial RBAC checks in README.md.

version: 1
metadata:
  name: nexus bootstrap
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  # ---------------------------------------------------------------- groups ---
  - id: group-admins
    model: authentik_core.group
    identifiers:
      name: admins
    attrs:
      name: admins
      is_superuser: false

  - id: group-beta
    model: authentik_core.group
    identifiers:
      name: beta-testers
    attrs:
      name: beta-testers
      is_superuser: false

  # ---------------------------------------------- scoped admin-API role ---
  # Must be defined before group-nexus-service, which resolves it via !KeyOf
  # (blueprint entries apply top-to-bottom; !KeyOf only sees earlier entries).
  # `authentik_core.change_group` is coarse — it also permits renaming /
  # re-scoping any non-superuser group. If the running Authentik ships a finer
  # "add/remove user to group" permission, use that instead and drop
  # change_group. Verify with the adversarial checks in README.md before this
  # touches real users.
  - id: role-nexus-admin-api
    model: authentik_rbac.role
    identifiers:
      name: nexus-admin-api
    attrs:
      name: nexus-admin-api
      permissions:
        - authentik_core.view_user
        - authentik_core.add_user
        - authentik_core.change_user
        - authentik_core.view_group
        - authentik_core.change_group

  # Holds svc-nexus and carries the scoped API role.
  - id: group-nexus-service
    model: authentik_core.group
    identifiers:
      name: nexus-service
    attrs:
      name: nexus-service
      is_superuser: false
      roles:
        - !KeyOf role-nexus-admin-api

  # ------------------------------------------------- groups -> token claim ---
  - id: scope-groups
    model: authentik_providers_oauth2.scopemapping
    identifiers:
      scope_name: groups
      name: "nexus groups claim"
    attrs:
      scope_name: groups
      name: "nexus groups claim"
      description: "Adds the user's group names as the `groups` claim."
      expression: |
        return {
            "groups": [group.name for group in request.user.ak_groups.all()],
        }

  # ------------------------------------------------------ nexus OIDC client ---
  - id: provider-nexus
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: nexus
    attrs:
      name: nexus
      client_type: confidential
      client_id: nexus
      # client_secret is auto-generated; read it from the provider in the admin
      # UI and store it in Cloudflare Secrets Store as `nexus-client-secret`.
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, "authentik Self-signed Certificate"],
        ]
      redirect_uris:
        - matching_mode: strict
          url: https://nexus.landeck.pro/api/auth/callback/authentik
        - matching_mode: strict
          url: http://localhost:8787/api/auth/callback/authentik
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !KeyOf scope-groups

  - id: app-nexus
    model: authentik_core.application
    identifiers:
      slug: nexus
    attrs:
      name: nexus
      slug: nexus
      provider: !KeyOf provider-nexus
      meta_description: "Account console for landeck.pro apps."
      # No policy binding -> any authenticated user may sign in. The `admins`
      # gate for /admin is a claim check inside nexus, not a policy here.

  # ------------------------------------------ meat-and-potatoes OIDC client ---
  # Provider created now so the app's future "create account" launch page works.
  # App code is not wired up yet. Public: no group required.
  - id: provider-map
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: meat-and-potatoes
    attrs:
      name: meat-and-potatoes
      client_type: confidential
      client_id: meat-and-potatoes
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, "authentik Self-signed Certificate"],
        ]
      redirect_uris:
        - matching_mode: strict
          url: https://landeck.pro/apps/meat-and-potatoes/api/auth/callback/authentik
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !KeyOf scope-groups

  - id: app-map
    model: authentik_core.application
    identifiers:
      slug: meat-and-potatoes
    attrs:
      name: Meat & Potatoes
      slug: meat-and-potatoes
      provider: !KeyOf provider-map
      meta_description: "Turn a week of dinners into one Walmart grocery cart."

  # -------------------------------------------- scoped admin-API principal ---
  - id: user-svc-nexus
    model: authentik_core.user
    identifiers:
      username: svc-nexus
    attrs:
      username: svc-nexus
      name: "nexus service account"
      type: service_account
      path: goauthentik.io/service-accounts
      is_active: true
      groups:
        - !KeyOf group-nexus-service

  - id: token-nexus-api
    model: authentik_core.token
    identifiers:
      identifier: nexus-api
    attrs:
      identifier: nexus-api
      intent: api
      user: !KeyOf user-svc-nexus
      description: "nexus /admin — scoped user/group management. Store key in Cloudflare Secrets Store."
      expiring: false

  # ----------------------------------- WebAuthn step-up for the admins group ---
  - id: stage-webauthn-enroll
    model: authentik_stages_authenticator_webauthn.authenticatorwebauthnstage
    identifiers:
      name: nexus-admins-webauthn-enroll
    attrs:
      name: nexus-admins-webauthn-enroll
      user_verification: required
      resident_key_requirement: preferred

  - id: stage-admins-webauthn
    model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    identifiers:
      name: nexus-admins-webauthn-validate
    attrs:
      name: nexus-admins-webauthn-validate
      not_configured_action: configure
      device_classes:
        - webauthn
      webauthn_user_verification: required
      configuration_stages:
        - !KeyOf stage-webauthn-enroll

  - id: policy-is-admin
    model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: nexus-is-admin
    attrs:
      name: nexus-is-admin
      expression: |
        return ak_is_group_member(request.user, name="admins")

  # Insert the step-up stage into the default authentication flow. Order 31 puts
  # it just after the built-in password/MFA-validation stages (order ~20-30) and
  # before the login stage (order ~100). Check the existing bindings' orders in
  # the admin UI if the flow refuses to bind here.
  - id: fsb-admins-webauthn
    model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !KeyOf stage-admins-webauthn
    attrs:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !KeyOf stage-admins-webauthn
      order: 31
      evaluate_on_plan: false
      re_evaluate_policies: true

  - id: pb-admins-webauthn
    model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf fsb-admins-webauthn
      policy: !KeyOf policy-is-admin
    attrs:
      target: !KeyOf fsb-admins-webauthn
      policy: !KeyOf policy-is-admin
      order: 0
      enabled: true
      timeout: 30
