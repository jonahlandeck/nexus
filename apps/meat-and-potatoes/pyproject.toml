[project]
name = "meat-and-potatoes-worker"
version = "0.1.0"
description = "Cloudflare Python Worker packaging for the meat-and-potatoes app"
requires-python = ">=3.13"
# Pure-Python / Pyodide-provided only. The FastAPI app package (backend/app) is
# NOT a dependency - scripts/stage-app.sh copies it to src/app so `import
# app.main` resolves inside the Worker bundle.
dependencies = [
    "fastapi",
    "pydantic",
    "httpx",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
