[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meat-and-potatoes-backend"
version = "0.1.0"
description = "Diet + Walmart meal-planning app - FastAPI backend (Cloudflare Python Worker)"
requires-python = ">=3.11"
# Runtime deps only. Persistence is Cloudflare D1 via the Worker binding, so
# there is no SQLAlchemy / driver here; config comes from the Worker env, so no
# pydantic-settings / dotenv. All pure-Python (Pyodide-compatible).
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# For running the app outside Workers (plain uvicorn) and the test suite.
dev = [
    "uvicorn[standard]>=0.29",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools]
packages = [
    "app",
    "app.routers",
    "app.services",
    "app.services.grocery",
]
